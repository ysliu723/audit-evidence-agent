name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No API key here: the Claude tests use a scripted API, so CI costs nothing.
      - name: Run tests
        run: pytest

      - name: The committed cases are exactly what the generator writes
        run: python -m scripts.generate_cases && git diff --exit-code -- data/evidence

      # The exact scores are asserted in tests/test_evaluation.py; this runs the command-line path end to end.
      - name: The oracle and the template baseline evaluations run
        run: |
          python -m evaluation.evaluate --extractor oracle --split all
          python -m evaluation.evaluate --extractor rules
