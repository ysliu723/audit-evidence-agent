name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No API key here: the Claude tests use a scripted API, so CI costs nothing.
      - name: Run tests
        run: pytest

      - name: Baseline evaluation still runs
        run: python -m evaluation.evaluate --extractor rules --out /tmp/evaluation-rules.md
